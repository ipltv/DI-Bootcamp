<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>

<body>
    <form id="cityForm">
        <label for="lat1">City 1 Latitude:</label>
        <input type="number" name="lat1" id="lat1" step="any" value="48.864716" required>
        <br>

        <label for="lon1">City 1 Longitude:</label>
        <input type="number" name="lon1" id="lon1" step="any" value="2.349014" required>
        <br>

        <label for="lat2">City 2 Latitude:</label>
        <input type="number" name="lat2" id="lat2" step="any" value="40.730610" required>
        <br>

        <label for="lon2">City 2 Longitude:</label>
        <input type="number" name="lon2" id="lon2" step="any" value="-73.935242" required>
        <br>

        <input type="submit" value="Show Sunset/Sunrise Time">
    </form>
    <div id="root"></div>
</body>

</html>
